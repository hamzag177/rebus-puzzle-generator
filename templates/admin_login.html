<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>REBUS Admin -- Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    {% include "_header.html" %}

    <div class="container fade-in">
        <h1>Admin Login</h1>
        <p class="progress">Enter the admin passcode to manage puzzles.</p>

        {% if error %}
            <p class="message error">{{ error }}</p>
        {% endif %}

        <form method="post" action="{{ url_for('admin_login') }}" class="guess-form">
            <input type="password" name="passcode" placeholder="Passcode" autofocus autocomplete="off">
            <div class="guess-buttons">
                <button type="submit" class="btn-primary">Enter</button>
            </div>
        </form>

        <p class="back-link"><a href="{{ url_for('home') }}">&larr; Back to Home</a></p>
    </div>
</body>
</html>
